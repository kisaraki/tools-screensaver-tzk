name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: >
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --component clippy
          --target x86_64-pc-windows-msvc
          --no-self-update

      - name: Build and run non-interactive tests
        shell: cmd
        run: scripts\build.bat

      - name: Run non-interactive smoke test
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $smokeOutput = Join-Path $env:RUNNER_TEMP 'MyDateTimeScreensaver-smoke'
          & .\scripts\smoke-test.ps1 `
            -ArtifactPath .\dist\MyDateTimeScreensaver.scr `
            -OutputDirectory $smokeOutput
