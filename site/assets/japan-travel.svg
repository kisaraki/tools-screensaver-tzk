<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" role="img" aria-labelledby="title desc">
  <title id="title">日本旅行模式靜態示意</title>
  <desc id="desc">A380 客艙窗框風格中可見晴朗天空、機翼、日本山景與京都地區標示。</desc>
  <defs>
    <linearGradient id="cabin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28312d"/>
      <stop offset="0.5" stop-color="#101713"/>
      <stop offset="1" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2384c2"/>
      <stop offset="0.62" stop-color="#8bd2eb"/>
      <stop offset="1" stop-color="#f6d2ad"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7f3"/>
      <stop offset="1" stop-color="#95a49b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#27f55d" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="view">
      <rect x="166" y="54" width="868" height="444" rx="116"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".58"/>
    </filter>
  </defs>

  <rect width="1200" height="554" fill="#020403"/>
  <path d="M82 277C82 104 183 18 350 18h500c167 0 268 86 268 259S1017 536 850 536H350C183 536 82 450 82 277Z" fill="url(#cabin)" stroke="#39453e" stroke-width="3" filter="url(#shadow)"/>
  <path d="M118 277C118 126 207 42 356 42h488c149 0 238 84 238 235s-89 235-238 235H356c-149 0-238-84-238-235Z" fill="#758078" opacity=".32"/>
  <rect x="151" y="39" width="898" height="476" rx="130" fill="#0a0f0c" stroke="#aab4ad" stroke-opacity=".36" stroke-width="5"/>

  <g clip-path="url(#view)">
