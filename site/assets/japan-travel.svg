    <path d="m509 272 34-49 38 49-21-5-16 20-15-19Z" fill="#eef4ef"/>
    <path d="M166 435c139-28 236-19 350 7 158 36 297 30 518-10v66H166Z" fill="#293d36"/>
    <path d="M172 389c180-24 308-30 448-18l343-93 19 15-307 156-100 13-14-20-389-30Z" fill="url(#wing)" stroke="#76877c" stroke-width="3"/>
    <path d="m908 293 75-54-1 54-44 34Z" fill="#27f55d" opacity=".8"/>
    <rect x="166" y="54" width="868" height="444" fill="url(#glass)"/>
