  <rect x="166" y="54" width="868" height="444" rx="116" fill="none" stroke="#dce4de" stroke-opacity=".6" stroke-width="8"/>
  <rect x="180" y="68" width="840" height="416" rx="104" fill="none" stroke="#111915" stroke-width="10"/>
  <path d="M225 87c58-25 150-28 214-17" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="8" stroke-linecap="round"/>

