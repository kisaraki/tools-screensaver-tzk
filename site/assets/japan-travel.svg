      <ellipse cx="333" cy="190" rx="63" ry="27"/>
      <ellipse cx="405" cy="204" rx="90" ry="18"/>
      <ellipse cx="853" cy="170" rx="73" ry="17"/>
      <ellipse cx="909" cy="158" rx="47" ry="24"/>
